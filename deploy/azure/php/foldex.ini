; PHP en Azure App Service (se carga con la App Setting PHP_INI_SCAN_DIR).
; Portadas de hasta 2 MB (validación de Laravel) con margen para el resto del formulario.
upload_max_filesize = 8M
post_max_size = 10M
memory_limit = 256M
expose_php = Off
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
