# Nginx para Azure App Service (Linux, PHP). El arranque (startup.sh) copia este archivo sobre
# /etc/nginx/sites-available/default: sirve public/ como raíz y manda todo lo demás a Laravel.
server {
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot/public;
    index index.php;
    server_name _;
    port_in_redirect off;
    charset utf-8;

    # Portadas de proyectos (disco "public" de Laravel), sin depender del enlace simbólico.
    client_max_body_size 10M;
    location /storage/ {
        alias /home/site/wwwroot/storage/app/public/;
        access_log off;
        expires 7d;
    }

    # Recursos compilados por Vite (nombres con hash): caché larga.
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Nunca exponer archivos ocultos (.env, .git...).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Laravel responde sus propios errores (JSON en /api); nginx no debe reemplazarlos.
        fastcgi_intercept_errors off;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }
}
