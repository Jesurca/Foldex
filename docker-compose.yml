services:
  db:
    image: postgres:17-alpine
    container_name: proyectos_unab_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-proyectos_unab}
      POSTGRES_USER: ${DB_USERNAME:-proyectos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-proyectos} -d ${DB_DATABASE:-proyectos_unab}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
